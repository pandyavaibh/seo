name: Nightly database backup

# The Supabase free plan has no backups and no point-in-time recovery.
# This is the one thing Stage 0 requires us to build ourselves: a
# nightly pg_dump of the production database, committed to a private
# backups branch. Restoring one of these dumps into staging is part of
# Stage 0's exit criteria — do that manually once, then re-verify
# periodically; this workflow does not restore automatically.
#
# Required repo secret:
#   PROD_DB_URL — the production Supabase project's connection string
#   (Settings → Database → Connection string → URI, "postgres" user),
#   with the password filled in. Add it via
#   Settings → Secrets and variables → Actions → New repository secret.
# This workflow is inert (the job below no-ops) until that secret exists.

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC nightly — avoid the top of the hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check backup secret is configured
        id: check
        run: |
          if [ -z "${{ secrets.PROD_DB_URL }}" ]; then
            echo "PROD_DB_URL is not set — skipping backup. Add it in repo Settings > Secrets before relying on this workflow." >&2
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'
        with:
          ref: backups
          fetch-depth: 1
        continue-on-error: true
        id: checkout-backups

      - name: Create orphan backups branch if it doesn't exist yet
        if: steps.check.outputs.configured == 'true' && steps.checkout-backups.outcome == 'failure'
        run: |
          git checkout --orphan backups
          git rm -rf . 2>/dev/null || true

      - name: Install postgresql-client
        if: steps.check.outputs.configured == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump production database
        if: steps.check.outputs.configured == 'true'
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          mkdir -p dumps
          stamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          pg_dump "$PROD_DB_URL" --no-owner --no-privileges --format=custom \
            --file="dumps/${stamp}.dump"
          # Keep the last 30 nightly dumps; older ones are pruned so the
          # backups branch doesn't grow without bound.
          ls -1t dumps/*.dump | tail -n +31 | xargs -r rm --

      - name: Commit dump
        if: steps.check.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dumps/
          git commit -m "backup: nightly pg_dump $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          git push origin backups
