# Cloudflare Workers Builds config for a static Vite SPA (assets-only —
# no Worker script). `npm run build` produces ./dist, this tells
# `wrangler deploy` to serve it, and routes unmatched paths back to
# index.html so React Router's client-side routes work on direct load
# or refresh (e.g. /projects).

name = "seo"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
