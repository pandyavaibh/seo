# Supabase CLI project config (see https://supabase.com/docs/guides/local-development)
# Generated by hand for Stage 0 — the Supabase CLI is not available in this
# environment, so this wasn't produced by `supabase init`. Before doing any
# local development, run `supabase init` fresh in an environment with the
# CLI installed and diff it against this file; this is a best-effort
# reconstruction of what that command would produce for project_id "seo-crm".

project_id = "seo-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[edge_runtime]
enabled = true

[analytics]
enabled = false
